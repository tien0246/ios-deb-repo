<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Browse and download packages from this iOS APT repository.">
  <title>repo — iOS packages</title>
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to packages</a>

  <header class="site-header">
    <div class="shell site-header__inner">
      <a class="brand" href="./" aria-label="repo home">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 8h17v12h-17zM3.5 10.5h17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M8 5.5V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M10.2 8V6.2a1.8 1.8 0 0 1 3.6 0V8" fill="#ffd65a" stroke="#8b6411" stroke-width="1.1"/>
        </svg>
        <span>repo</span>
      </a>
      <a class="github-link" href="https://github.com/tien0246/repo" target="_blank" rel="noreferrer">
        GitHub
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3h8v8M13 3 4 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </header>

  <main class="shell" id="main">
    <section class="catalog" id="packages" aria-labelledby="page-title">
      <header class="repo-intro">
        <h1 id="page-title">Packages</h1>
        <img class="repo-art" src="assets/pocket-flat.webp" width="560" height="560" alt="" fetchpriority="high">
        <div class="source-control" id="add-source">
          <code id="source-address">https://tien0246.github.io/repo/</code>
          <button id="copy-source" class="copy-button" type="button" aria-label="Copy source URL">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="6" width="9" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.5 6V4.5A1.5 1.5 0 0 0 11 3H5.5A1.5 1.5 0 0 0 4 4.5v8A1.5 1.5 0 0 0 5.5 14H7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>Copy</span>
          </button>
          <span id="copy-status" class="visually-hidden" role="status" aria-live="polite"></span>
        </div>
      </header>

      <div class="package-tools">
        <label class="search-field">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m13 13 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="visually-hidden">Search packages</span>
          <input id="package-search" type="search" placeholder="Search packages" autocomplete="off">
        </label>
        <a class="raw-index" href="Packages.bz2" aria-label="Open raw package index">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 14v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Index</span>
        </a>
        <output id="package-count" class="visually-hidden" aria-live="polite">Loading</output>
      </div>

      <p id="package-status" class="package-status" role="status" aria-live="polite" hidden></p>
      <ul id="package-list" class="package-list" aria-label="Available packages"></ul>
      <noscript><p class="noscript-note">JavaScript is required to filter packages. <a href="Packages.bz2">Open the raw index</a>.</p></noscript>
    </section>
  </main>
</body>
</html>
